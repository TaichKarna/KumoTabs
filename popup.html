<!DOCTYPE html>
<html>
  <head>
    <title>TabProjects</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div style="display: flex; align-items: center; gap: calc(10px)">
          <image src="/icons/icon482.png"></image>
          <h1>KumoTabs</h1>
        </div>
        <div class="actions">
          <button id="saveTabsBtn" class="btn primary">Save All Tabs</button>
          <button id="toggleAutoSaveBtn" class="btn secondary">
            Auto-Save: Off
          </button>
        </div>
      </header>

      <div class="search-container">
        <div class="search-input-wrapper">
          <svg
            class="search-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="text"
            id="searchInput"
            placeholder="Search projects..."
          />
        </div>
      </div>

      <div class="tabs-section">
        <div class="section-header">
          <h2>Current Tabs</h2>
          <div class="tabs-actions">
            <select id="windowSelector" class="select-input">
              <option value="all">All Windows</option>
            </select>
            <button id="addToExistingBtn" class="btn secondary">
              Add Selected
            </button>
          </div>
        </div>

        <div id="currentTabsList" class="current-tabs-list">
          <!-- Current tabs will be inserted here -->
        </div>

        <div id="existingProjectSelector" class="project-selector hidden">
          <div class="selector-header">
            <h3>Select Project</h3>
            <button id="cancelAddToExisting" class="btn text">Cancel</button>
          </div>
          <select id="projectSelect" class="select-input full-width">
            <!-- Projects will be inserted here -->
          </select>
          <button id="confirmAddToExisting" class="btn primary full-width">
            Add to Project
          </button>
        </div>
      </div>

      <div class="new-project">
        <input
          type="text"
          id="projectNameInput"
          placeholder="New project name..."
        />
        <button id="createProjectBtn" class="btn primary">Create</button>
      </div>

      <div class="section-header">
        <h2>Your Projects</h2>
        <div class="sort-options">
          <select id="sortSelect" class="select-input">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="name">Name (A-Z)</option>
            <option value="tabs">Tab Count</option>
          </select>
        </div>
      </div>

      <div class="projects-container" id="projectsList">
        <!-- Projects will be inserted here -->
      </div>
    </div>

    <div id="tabsModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalProjectName">Project Tabs</h2>
          <button id="closeModal" class="btn icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div id="modalTabsList" class="modal-tabs-list">
          <!-- Project tabs will be inserted here -->
        </div>
        <div class="modal-footer">
          <button id="saveTabChanges" class="btn primary">Save Changes</button>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
